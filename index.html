<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Confession Digital webpt</title>
    <!-- ပုံများကို နောက်ကွယ်မှ အရင်ဆွဲထားရန် -->
<link rel="preload" href="bg.webp" as="image">
<link rel="preload" href="bg2.jpg" as="image">
<link rel="preload" href="st.webp" as="image">

<!-- အသံဖိုင်ကို အရင်ဆွဲထားရန် -->
<link rel="preload" href="click.mp3" as="audio">
    <style>
        @font-face {
            font-family: 'LoveFont';
            src: url('love.ttf') format('truetype');
            font-display: swap;
        }

        :root {
            --bg-color: #ffdeeb;
            --card-color: #ffdeeb;
            --primary-color: #ff85a2;
            --text-color: #6d4c54;
            --clay-shadow: 8px 8px 16px #e0c4cf, -8px -8px 16px #ffffff;
            --btn-shadow: 5px 5px 10px #e0c4cf, -5px -5px 10px #ffffff;
            --btn-inset: inset 2px 2px 5px #ffffff, inset -2px -2px 5px #e0c4cf;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
    margin: 0; padding: 0; height: 100vh;
    display: flex; justify-content: center; align-items: center;
    
    /* --- အောက်ကအတိုင်း အတိအကျ ပြင်ပေးပါ --- */
    background-color: var(--bg-color); /* မူလ ပန်းရောင် ပြန်ပေါ်လာစေရန် */
    background-image: url('bg.webp'); 
    background-repeat: repeat;
    background-size: 250px; /* Doodle အရွယ်အစားကို ဒီမှာ ထပ်ညှိနိုင်သည် */
    background-attachment: fixed;
    
    /* Multiply ကို သုံးလိုက်ရင် ပုံထဲက အဖြူရောင်တွေ ပျောက်သွားပြီး ပန်းရောင် ပေါ်လာပါလိမ့်မယ် */
    background-blend-mode: multiply; 
    /* ---------------------------------- */

    font-family: 'LoveFont', 'Pyidaungsu', sans-serif;
    overflow: hidden; text-align: center;
}

        #emoji-layer {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        .floating-emoji {
            position: absolute; opacity: 0;
            object-fit: contain; pointer-events: none; z-index: 1;
        }

#container {
    background-color: var(--card-color) !important;
    
    /* ဤနေရာတွင် url('bg2.jpg') ကို လူကြီးမင်းသုံးမည့် ပုံနာမည်အတိုင်း သေချာစစ်ပေးပါ[span_3](start_span)[span_3](end_span) */
    background-image: linear-gradient(rgba(255, 235, 243, 0.3), rgba(255, 235, 243, 0.3)), url('bg2.jpg') !important;
    
    background-repeat: repeat !important;
    background-size: 120px !important;            
    background-position: center !important;    
    background-attachment: local !important;     
    
    /* Blend mode ကို multiply အစား normal ပြန်ထားပါ[span_4](start_span)[span_4](end_span) */
    background-blend-mode: normal !important; 


    /* ကျန်တဲ့ style များ */
    padding: 20px 15px; 
    border-radius: 30px;
    box-shadow: var(--clay-shadow);
    width: 70%; 
    max-width: 280px;
    transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative; 
    z-index: 10;
}

        /* Yes နှိပ်လိုက်သောအခါ အသုံးပြုမည့် အထူး Style */
        .container-success {
            transform: scale(1.1) !important;
            border: 3px solid var(--primary-color) !important;
        }

        .sticker-wrapper {
            position: relative; width: 180px; height: 180px; margin: 0 auto 30px;
        }

        /* မူလ video block နေရာမှာ ဒါကို အစားထိုးပါ */
.sticker-img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    display: none; /* အကုန်ဖျောက်ထားမည် */
}

.sticker-img.active {
    display: block; /* active ဖြစ်မှ ပြမည် */
}

        h1 { 
    color: var(--text-color); 
    font-size: 1.6rem; 
    margin-bottom: 40px; 
    height: 80px; /* အမြင့်ကို အသေသတ်မှတ်လိုက်ခြင်း */
    display: flex; 
    align-items: center; 
    justify-content: center; 
    overflow: hidden;
}

        .btn-container { display: flex; width: 100%; height: 70px; position: relative; }
        .btn-slot { width: 50%; display: flex; align-items: center; }
        .slot-left { justify-content: flex-end; padding-right: 10px; }
        .slot-right { justify-content: flex-start; padding-left: 10px; }

        button {
            padding: 10px 20px; font-size: 0.9rem; border: none;
            border-radius: 30px; cursor: pointer;
            font-family: 'LoveFont', sans-serif; font-weight: bold;
            transition: all 0.2s ease; position: relative; z-index: 100;
        }

        #yesBtn { background-color: var(--primary-color); color: white; box-shadow: var(--btn-shadow); }
        #noBtn { background-color: var(--card-color); color: var(--primary-color); box-shadow: var(--btn-shadow); border: 2px solid #ffffff; white-space: nowrap; }

        /* Normal Emoji Animation */
        @keyframes driftEmoji {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.4; }
            80% { opacity: 0.4; }
            100% { transform: translate(var(--tx), var(--ty)) rotate(var(--tr)); opacity: 0; }
        }

        /* Yes Button အထူး Emoji Animation (ပိုမြန်ပြီး ပိုပွင့်လင်းသည်) */
        @keyframes driftEmojiYes {
            0% { transform: translate(0, 0) scale(0); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translate(var(--tx), var(--ty)) rotate(var(--tr)) scale(1.3); opacity: 0; }
        }

        @media (max-width: 400px) {
            h1 { font-size: 1.2rem; }
            .sticker-wrapper { width: 130px; height: 130px; }
        }
        
#floating-bg-layer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1; /* နောက်ခံထက် မြင့်ရပါမယ် */
    overflow: hidden;
}

.bg-item {
    position: absolute;
    bottom: -50px;
    opacity: 0;
    fill: #ff85a2; /* အရောင်ကို ပိုတောက်အောင် အရင်စမ်းကြည့်ပါ */
    animation: floatUp linear forwards;
}

@keyframes floatUp {
    0% { transform: translateY(0) scale(0.5); opacity: 0; }
    20% { opacity: 0.5; }
    100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
}
        
    </style>
</head>
<body>

<div id="emoji-layer"></div>
<div id="floating-bg-layer"></div>


<div id="container">
    <div class="sticker-wrapper">
        <!-- မူလ video နေရာမှာ ဒါလေးတွေ အစားထိုးပါ -->
<img id="st-start" src="st.webp" class="sticker-img active">
<img id="st-1" src="st1.webp" class="sticker-img">
<img id="st-2" src="st2.png" class="sticker-img">
<img id="st-3" src="st3.webp" class="sticker-img">
<img id="st-4" src="st4.png" class="sticker-img">
<img id="st-5" src="st5.webp" class="sticker-img">
<img id="st-6" src="st6.webp" class="sticker-img">
<img id="st-7" src="st7.webp" class="sticker-img">
<img id="st-8" src="st8.webp" class="sticker-img">
<img id="st-9" src="st9.png" class="sticker-img">
<img id="st-10" src="st10.webp" class="sticker-img">
    </div>
    
    <h1 id="question">ချစ်လားဟင်</h1>

    <div class="btn-container">
        <div class="btn-slot slot-left">
            <button id="yesBtn">ချစ်တယ်</button>
        </div>
        <div class="btn-slot slot-right">
            <button id="noBtn">မချစ်ဘူး</button>
        </div>
    </div>
</div>

<script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const question = document.getElementById('question');
    const allStickers = document.querySelectorAll('.sticker-img');
    const container = document.getElementById('container');
    const emojiLayer = document.getElementById('emoji-layer');

    let noCount = 0;
    const noTexts = ["ချစ်ပါနော် အလိုလည်းလိုက်မယ်လေ", "ကပြမယ်လေ မချစ်ဘူးလား", "ဒီလိုလေးကပြရင်ရော ချစ်မှာလား", "စိတ်တိုလာပြီနော် ချစ်မှာလားမချစ်ဘူးလားပြော", "ခုထိချစ်သေးဘူးပေါ့ ခေါင်းနဲ့ဆောင့်လိုက်တော့မှာနော်" ,  "ချစ်လားမချစ်ဘူးလားအခုပြောနော် သတ်သေလိုက်မှာနော်", "ငိုချင်လာပြီနော် ချစ်လားလို့မေးနေတာကို", "တကယ်ကြီးမချစ်ဘူးလားဟင်" ,"ဟင့် ပိစိလေးတောင်မချစ်ချင်ဘူးလား"]; 

    const yesSound = new Audio('click.mp3');
    const noSound = new Audio('click.mp3');

    function showSticker(id) {
        allStickers.forEach(s => s.classList.remove('active'));
        const activeSticker = document.getElementById(id);
        if (activeSticker) activeSticker.classList.add('active');
    }

    // spawnEmojis နဲ့ moveNoButton function များကို မူလအတိုင်း ထားရှိပါသည်
    function spawnEmojis(imgSrc, count, isYes = false) {
        emojiLayer.innerHTML = "";
        const baseSize = window.innerWidth > 768 ? 60 : 40;
        for (let i = 0; i < count; i++) {
            const emoji = document.createElement('img');
            emoji.src = imgSrc;
            emoji.className = 'floating-emoji';
            const size = baseSize + (Math.random() * 20);
            emoji.style.width = size + 'px';
            emoji.style.height = size + 'px';
            const sides = ['top', 'bottom', 'left', 'right'];
            const side = sides[Math.floor(Math.random() * 4)];
            let startX, startY;
            if (side === 'top') { startX = Math.random() * window.innerWidth; startY = -size; }
            else if (side === 'bottom') { startX = Math.random() * window.innerWidth; startY = window.innerHeight + size; }
            else if (side === 'left') { startX = -size; startY = Math.random() * window.innerHeight; }
            else { startX = window.innerWidth + size; startY = Math.random() * window.innerHeight; }
            emoji.style.left = startX + 'px';
            emoji.style.top = startY + 'px';
            const targetX = (Math.random() - 0.5) * window.innerWidth * 2;
            const targetY = (Math.random() - 0.5) * window.innerHeight * 2;
            const rotation = Math.random() * 720;
            emoji.style.setProperty('--tx', targetX + 'px');
            emoji.style.setProperty('--ty', targetY + 'px');
            emoji.style.setProperty('--tr', rotation + 'deg');
            const duration = isYes ? (2 + Math.random() * 2) : (6 + Math.random() * 3);
            emoji.style.animation = isYes ? "driftEmojiYes " + duration + "s ease-out forwards" : "driftEmoji " + duration + "s ease-in-out forwards";
            emojiLayer.appendChild(emoji);
            setTimeout(() => emoji.remove(), duration * 1000);
        }
    }

    function moveNoButton() {
        const padding = 25;
        const btnRect = noBtn.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();
        let randomX, randomY, isValid = false;
        const minDistance = Math.min(window.innerWidth, window.innerHeight) * 0.3;
        let attempts = 0;
        while (!isValid && attempts < 300) {
            randomX = Math.floor(Math.random() * (window.innerWidth - btnRect.width - padding * 2)) + padding;
            randomY = Math.floor(Math.random() * (window.innerHeight - btnRect.height - padding * 2)) + padding;
            const buffer = 55;
            const overlapsContainer = (randomX + btnRect.width > containerRect.left - buffer && randomX < containerRect.right + buffer) &&
                                     (randomY + btnRect.height > containerRect.top - buffer && randomY < containerRect.bottom + buffer);
            const dx = randomX - btnRect.left;
            const dy = randomY - btnRect.top;
            if (!overlapsContainer && Math.sqrt(dx * dx + dy * dy) > minDistance) { isValid = true; }
            attempts++;
        }
        noBtn.style.position = 'fixed';
        noBtn.style.left = randomX + 'px';
        noBtn.style.top = randomY + 'px';
        noBtn.style.margin = '0';
    }

    noBtn.addEventListener('click', () => {
        noCount++;
        noSound.currentTime = 0; noSound.play();
        
        const loopableStickersCount = allStickers.length - 2; 
        const loopIdx = ((noCount - 1) % loopableStickersCount) + 1;
        const stickerId = 'st-' + loopIdx;

        // စာသားယူမည့်အပိုင်း (ဒီထဲမှာမှ FontSize ကို ညှိရမှာပါ)[span_5](start_span)[span_5](end_span)
        const textIdx = (noCount - 1) % noTexts.length;
        const currentText = noTexts[textIdx];

        // စာလုံးရေ ၁၅ လုံးထက်ကျော်ရင် Size သေးမည်[span_6](start_span)[span_6](end_span)
        if (currentText.length > 15) {
            question.style.fontSize = '1.1rem';
        } else {
            question.style.fontSize = '1.6rem';
        }

// ရှိပြီးသား emoji ၅ ခု (e1 မှ e5) ကိုပဲ ပြန်ပတ်သုံးမည့် Logic
        const emojiIdx = ((loopIdx - 1) % 5) + 1;



        showSticker(stickerId);
        question.innerText = currentText; // စာသားကို ဒီမှာ ပြောင်းပါ[span_7](start_span)[span_7](end_span)
        spawnEmojis('e' + emojiIdx + '.png', 25); 
        moveNoButton();
    });
    
    
    yesBtn.addEventListener('click', () => {
        yesSound.currentTime = 0; yesSound.play();
        noBtn.style.display = 'none';
        yesBtn.style.opacity = '0';
        yesBtn.style.pointerEvents = 'none';

        setTimeout(() => {
            // အမြဲတမ်း HTML ထဲက နောက်ဆုံးပိတ် Sticker ID ကို ယူပြခြင်း
            const lastStickerId = allStickers[allStickers.length - 1].id;
            showSticker(lastStickerId);

            question.innerHTML = "ရေးးးး သိသားပဲချစ်တယ်ဆိုတာ မချစ်ဘူးဆိုပြီးမူနေသေးတယ် ဟွန့်";
            spawnEmojis('e6.png', 80, true); 
            container.classList.add('container-success'); 
        }, 300);
    });

    window.addEventListener('resize', () => {
        if (noBtn.style.position === 'fixed') moveNoButton();
    });
    
const assetsToLoad = [
    'st.webp', 'st1.webp', 'st2.png', 'st3.webp', 'st4.png', 
    'st5.webp', 'st6.webp', 'st7.webp', 'st8.webp', 'st9.png', 'st10.webp',
    'e1.png', 'e2.png', 'e3.png', 'e4.png', 'e5.png', 'e6.png',
    'bg.webp', 'bg2.jpg', 'click.mp3'
];

function silentPreload() {
    assetsToLoad.forEach(src => {
        if (src.endsWith('.mp3')) {
            const audio = new Audio();
            audio.src = src;
            audio.preload = 'auto'; // နောက်ကွယ်မှ အလိုအလျောက် Load လုပ်ခိုင်းခြင်း
        } else {
            const img = new Image();
            img.src = src; // Image object တည်ဆောက်ပြီးတာနဲ့ Browser က cache ထဲမှာ သိမ်းထားပေးမှာပါ
        }
    });
    console.log("Background preloading started...");
}

// Website တက်တာနဲ့ အနောက်ကနေ တိတ်တဆိတ် လုပ်ခိုင်းမည်
window.addEventListener('load', silentPreload);



const bgLayer = document.getElementById('floating-bg-layer');
const heartPath = "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z";

function createFloatingItem() {
    if (!bgLayer) return; // Layer မရှိရင် ဘာမှမလုပ်ပါနဲ့

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("class", "bg-item");
    svg.style.width = (15 + Math.random() * 20) + 'px';
    svg.style.left = Math.random() * window.innerWidth + 'px';
    svg.style.animationDuration = (8 + Math.random() * 5) + 's';

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", heartPath);
    
    svg.appendChild(path);
    bgLayer.appendChild(svg);

    setTimeout(() => svg.remove(), 13000);
}

// ဒီစာကြောင်း ပါ၊ မပါ သေချာစစ်ပါ
setInterval(createFloatingItem, 200);
</script>
</body>
</html>
